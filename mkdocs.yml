site_name: "SpiceQL Manual"
# Canonical home of the built docs, now that they are published by GitHub Pages
# rather than synced to S3. Only affects canonical tags and sitemap.xml —
# in-page links stay relative, so the site still works served from any path.
site_url: "https://doi-usgs.github.io/SpiceQL/"


theme:
  name: material
  # Two entries, so the switch is a plain flip between light and dark with no
  # third "follow the system" stop. The `media` on each is still what decides
  # which one a first-time visitor lands on — Material picks the entry whose
  # query matches the OS — after which a click stores the choice and the OS stops
  # having a say. Each entry's `toggle` is the control shown *while that entry is
  # active*, so the icon and label describe where the next click goes.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # favicon: assets/favicon.ico
  site_name_style: bold
  title_style: light 
  icon:
    annotation: material/chevron-right-circle
  font:
    text: Inter
    code: Roboto Mono

  highlightjs: true
  components:
    site_name: true
    title: false
    menu: false
    preview: true
    footer: false

  features:
      - navigation.tabs
      - navigation.path
      - navigation.indexes
      - search.suggest
      - search.suggest
      - content.tabs.link

extra_css: 
  - assets/extra.css
  - assets/spiceql-applet.css

nav:
  - index.md
  - "[ C++ API ]":
      - 'Namespaces':
          - 'Namespace List': 'SpiceQLCPPAPI/namespaces.md'
          - 'Functions': 'SpiceQLCPPAPI/namespace_member_functions.md'
  - "[ RESTful API ]": "https://astrogeology.usgs.gov/apis/spiceql/latest/docs"
  - "[ USGS Astrogeology Docs ]" : https://astrogeology.usgs.gov/docs/

markdown_extensions:
  # Lets the runnable applet on the home page wrap a highlighted code fence in its
  # own <div markdown="1">, so the kernel stack, the code and the plot are one box.
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.superfences 
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
  - swagger-ui-tag
  - mkdoxy:
      projects:
        SpiceQLCPPAPI: 
          src-dirs: SpiceQL/include/SpiceQL
          FILE_PATTERNS: 'api.h inventory.h'  
          full-doc: True # if you want to generate full documentation
          doxy-cfg: # standard doxygen configuration (key: value)
            RECURSIVE: false # recursive search in source directories
  # Writes llms.txt and llms-full.txt to the site root, on build and serve alike.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        SpiceQL is a C++ library, with Python bindings, a WebAssembly build and a
        hosted REST API, for querying, reading and writing NAIF SPICE kernels.
      sections:
        Overview:
          - index.md
        # SpiceQL's own namespaces and classes only, which leaves out mkdoxy's
        # source listings, its index pages, and restincurl/std/spdlog.
        C++ API:
          - SpiceQLCPPAPI/namespace_spice_q_l*.md
          - SpiceQLCPPAPI/class_spice_q_l_*.md
          - SpiceQLCPPAPI/struct_spice_q_l_*.md
